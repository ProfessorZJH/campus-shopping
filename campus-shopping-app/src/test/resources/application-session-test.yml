spring:
  datasource:
    url: jdbc:h2:mem:campus_session;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/session-test-schema.sql
      data-locations: classpath:sql/session-test-data.sql
server:
  servlet:
    session:
      cookie:
        secure: false

campus:
  database:
    validate-schema: false
  jobs:
    enabled: false
  security:
    rate-limit-enabled: false
