spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: campus-shopping
  profiles:
    default: dev
  sql:
    init:
      mode: ${DB_INIT_MODE:never}
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
server:
  port: ${PORT:8091}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*_mapper.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
campus:
  redis:
    enabled: ${REDIS_ENABLED:true}
    namespace: ${REDIS_NAMESPACE:cs:dev}
    security-address: ${REDIS_SECURITY_ADDRESS:redis://127.0.0.1:6379}
    security-password: ${REDIS_SECURITY_PASSWORD:}
    cache-address: ${REDIS_CACHE_ADDRESS:redis://127.0.0.1:6380}
    cache-password: ${REDIS_CACHE_PASSWORD:}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN:false}
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  ai:
    url: ${AI_SERVICE_URL:http://127.0.0.1:8100}
    service-key: ${AI_SERVICE_KEY:}
    agent-runtime:
      enabled: ${AI_AGENT_RUNTIME_ENABLED:false}
      timeout-seconds: ${AI_AGENT_RUNTIME_TIMEOUT_SECONDS:60}
    agent-consumer-readonly:
      enabled: ${AI_AGENT_CONSUMER_READONLY_ENABLED:false}
    egress:
      base-ids: ${AI_EGRESS_BASE_IDS:}
      merchant-ids: ${AI_EGRESS_MERCHANT_IDS:}
    product-sync:
      enabled: ${AI_PRODUCT_VECTOR_SYNC_ENABLED:false}
  uploads: ${UPLOAD_DIR:./var/uploads}
  images:
    # 默认 LOCAL，历史本地图片路由保持不变；显式选择 QINIU 才启用云上传。
    provider: ${IMAGE_PROVIDER:LOCAL}
    qiniu:
      # 只通过环境变量或私有配置注入真实凭据，仓库内不写值。
      access-key: ${QINIU_ACCESS_KEY:}
      secret-key: ${QINIU_SECRET_KEY:}
      bucket: ${QINIU_BUCKET:}
      download-domain: ${QINIU_DOWNLOAD_DOMAIN:}
      private-bucket: ${QINIU_PRIVATE_BUCKET:true}
      # 本机开发测试例外：默认 false；为 true 时仅 dev + 回环 + 公有桶 + 七牛测试域名形状可用明文 HTTP 展示。
      public-http-download: ${QINIU_PUBLIC_HTTP_DOWNLOAD:false}
      signature-ttl-seconds: ${QINIU_SIGNATURE_TTL_SECONDS:300}
      connect-timeout-seconds: ${QINIU_CONNECT_TIMEOUT_SECONDS:5}
      read-timeout-seconds: ${QINIU_READ_TIMEOUT_SECONDS:15}
      write-timeout-seconds: ${QINIU_WRITE_TIMEOUT_SECONDS:15}
      retry-max: ${QINIU_RETRY_MAX:2}
      # 上传必须显式固定区域（z0/z1/z2/na0/as0/cn-east-2）；不支持 auto，也不默认猜测 bucket 区。
      region: ${QINIU_REGION:}
  order:
    payment-minutes: ${ORDER_TIMEOUT_MINUTES:15}
    expiry-scan-ms: ${ORDER_EXPIRY_SCAN_MS:15000}
  proposal:
    minutes: ${PROPOSAL_TTL_MINUTES:10}
  jobs:
    enabled: true
  security:
    rate-limit-enabled: true
