server:
  address: 0.0.0.0
  # 默认不信任任意客户端转发头；仅在受控边缘代理清洗转发头后通过 FORWARD_HEADERS_STRATEGY=framework 显式开启。
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

campus:
  redis:
    require-separate-instances: true
