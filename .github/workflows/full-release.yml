name: Campus Shopping - Real Acceptance
on:
  push:
    branches: [main]
    paths: ['pom.xml', 'campus-shopping-*/**', 'ai-service/**', 'frontend/**', 'scripts/**', 'docs/**', 'compose.yml']
  pull_request:
    paths: ['pom.xml', 'campus-shopping-*/**', 'ai-service/**', 'frontend/**', 'scripts/**', 'docs/**', 'compose.yml']
  workflow_dispatch:
    inputs:
      external_ai:
        description: 'Run live NVIDIA, XFYUN and Milvus read-only checks (requires private secrets)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-stack:
    name: Maven / MySQL / FastAPI / Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require complete project
        run: |
          test -f pom.xml || { echo 'Project source missing. Import v1.2.3 first.'; exit 1; }
          test -f scripts/smoke-full.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - name: Install Python and Chromium
        run: |
          python -m pip install -r ai-service/requirements-dev.txt playwright==1.58.0 pyyaml==6.0.3
          python -m playwright install --with-deps chromium
      - name: API, SDD and source safety
        run: |
          python scripts/verify-api-contract.py
          python scripts/verify-fix-regressions.py
          python scripts/verify-source.py
      - name: Start isolated MySQL for Maven IT
        shell: bash
        run: |
          set -euo pipefail
          DB_PASS=$(openssl rand -hex 24)
          ADMIN_PASS=$(openssl rand -hex 24)
          SERVICE_KEY=$(openssl rand -hex 32)
          for value in "$DB_PASS" "$ADMIN_PASS" "$SERVICE_KEY"; do echo "::add-mask::$value"; done
          {
            echo 'MYSQL_TEST_URL=jdbc:mysql://127.0.0.1:3307/campus_shopping_it?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
            echo 'MYSQL_TEST_USERNAME=campus_it'
            echo "MYSQL_TEST_PASSWORD=$DB_PASS"
            echo "DB_PASSWORD=$DB_PASS"
            echo 'ADMIN_USERNAME=ci_admin'
            echo "ADMIN_PASSWORD=$ADMIN_PASS"
            echo "AI_SERVICE_KEY=$SERVICE_KEY"
          } >> "$GITHUB_ENV"
          docker run -d --name campus-mysql-it -p 127.0.0.1:3307:3306 -e MYSQL_RANDOM_ROOT_PASSWORD=yes -e MYSQL_DATABASE=campus_shopping_it -e MYSQL_USER=campus_it -e MYSQL_PASSWORD="$DB_PASS" mysql:8.0.36
          for n in $(seq 1 90); do
            if docker exec -e MYSQL_PWD="$DB_PASS" campus-mysql-it mysql -ucampus_it -e 'SELECT 1' campus_shopping_it >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Real Maven compilation + MySQL integration tests
        run: mvn -B -ntp clean verify
      - name: Domain, HTTP and Python AI tests
        run: |
          python scripts/verify-domain.py
          python scripts/verify-http-body.py
          python scripts/verify-release.py
          mkdir -p docs/testing/evidence
          (cd ai-service && python -m pytest -q --junitxml=../docs/testing/evidence/ai-unit-tests.xml)
          python ai-service/evaluate.py
          python scripts/smoke-ai-local.py
      - name: Chromium UI contracts (mocked API)
        run: |
          python frontend/tests/contract_ui.py
          python frontend/tests/ui_sdd_integration.py
          python frontend/tests/ui_contract_v11.py
          python frontend/tests/ui_fix_regression.py
          python frontend/tests/ui_rbac_regression.py
          python frontend/tests/ui_global_sort.py
      - name: Start real MySQL / Spring Boot / FastAPI
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name campus-mysql-e2e -p 127.0.0.1:3308:3306 -e MYSQL_RANDOM_ROOT_PASSWORD=yes -e MYSQL_DATABASE=campus_shopping -e MYSQL_USER=campus_app -e MYSQL_PASSWORD="$DB_PASSWORD" mysql:8.0.36
          READY=0
          for n in $(seq 1 90); do
            if docker exec -e MYSQL_PWD="$DB_PASSWORD" campus-mysql-e2e mysql -ucampus_app -e 'SELECT 1' campus_shopping >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          test "$READY" = 1
          docker exec -i -e MYSQL_PWD="$DB_PASSWORD" campus-mysql-e2e mysql -ucampus_app campus_shopping < campus-shopping-app/src/main/resources/schema.sql
          docker exec -i -e MYSQL_PWD="$DB_PASSWORD" campus-mysql-e2e mysql -ucampus_app campus_shopping < campus-shopping-app/src/main/resources/data.sql
          mkdir -p var/ci docs/testing/evidence
          (cd ai-service && AI_DB_PATH=../var/ci/knowledge.sqlite3 python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8100) > var/ci/ai.log 2>&1 &
          echo $! > var/ci/ai.pid
          DB_URL='jdbc:mysql://127.0.0.1:3308/campus_shopping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC' DB_USERNAME=campus_app BOOTSTRAP_ADMIN=true SESSION_COOKIE_SECURE=false java -jar campus-shopping-app/target/campus-shopping-app.jar --spring.profiles.active=dev > var/ci/app.log 2>&1 &
          echo $! > var/ci/app.pid
          for n in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8091/api/v1/categories | grep -q '"code":"0000"'; then exit 0; fi
            sleep 1
          done
          echo 'Spring Boot readiness failed'; exit 1
      - name: Real cross-service HTTP business E2E
        run: python scripts/smoke-full.py
      - name: Real frontend against Spring Boot
        run: python frontend/tests/live_ui.py
      - name: Upload evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-acceptance-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/*
            docs/testing/evidence/**
            var/ci/*.log
      - name: Stop isolated services
        if: always()
        run: |
          for p in var/ci/app.pid var/ci/ai.pid; do if [ -f "$p" ]; then kill "$(cat "$p")" || true; fi; done
          docker rm -f campus-mysql-it campus-mysql-e2e || true
  external-ai:
    name: Optional live NVIDIA / XFYUN / Milvus smoke (read-only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_ai == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EMBEDDING_BASE_URL: https://integrate.api.nvidia.com/v1
      EMBEDDING_MODEL: nvidia/nemotron-3.5-embed-1b
      EMBEDDING_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      LLM_BASE_URL: https://maas-api.cn-huabei-1.xf-yun.com/v2
      LLM_MODEL: ${{ vars.XFYUN_MODEL }}
      LLM_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      MILVUS_URI: ${{ secrets.MILVUS_URI }}
      MILVUS_TOKEN: ${{ secrets.MILVUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require source and private configuration
        shell: bash
        run: |
          test -f ai-service/requirements.txt
          for key in EMBEDDING_API_KEY LLM_API_KEY LLM_MODEL MILVUS_URI MILVUS_TOKEN; do
            if [ -z "$(printenv "$key" 2>/dev/null || true)" ]; then echo "Missing secret or variable: $key"; exit 1; fi
          done
      - name: Install service dependencies
        run: python -m pip install -r ai-service/requirements.txt
      - name: Real remote smoke without writes
        run: |
          (cd ai-service && python -m app.smoke_model)
          (cd ai-service && python -m app.smoke_vector)
