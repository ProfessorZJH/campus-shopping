name: Campus Shopping - Real Acceptance

on:
  push:
    branches: [main]
  # 必需检查必须覆盖所有PR，AGENTS/模板等改动也不能因路径过滤永久Pending。
  pull_request: {}
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      external_ai:
        description: 'Run read-only NVIDIA, XFYUN and Milvus connectivity checks (requires secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-quality:
    name: Quick quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r ai-service/requirements-dev.lock
          npm ci --prefix frontend --no-audit --no-fund
      - name: Source and reproducibility gates
        run: |
          npm run format:check --prefix frontend
          node --test frontend/tests/*.test.mjs
          python scripts/build-ui-bundle.py --check
          python scripts/schema_contract.py --check
          python scripts/verify-supply-chain.py
          python scripts/verify-api-contract.py
          python scripts/verify-api-schemas.py
          python scripts/verify-java-readability.py
          python scripts/verify-release.py
      - name: Python and Java deterministic regressions
        run: |
          (cd ai-service && python -m pytest -q)
          bash ./mvnw -B -ntp test -Dtest=SkuConstraintPolicyTest,PurchaseConstraintTest,DddRulesTest,AiConversationBoundaryTest,ContextPathQuotaTest,ProductionSecurityGuardTest,ProtocolBoundaryTest -Dsurefire.failIfNoSpecifiedTests=false
          python scripts/verify-domain.py
          python scripts/verify-http-body.py
      - name: Upload quick diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: campus-quick-diagnostics
          retention-days: 7
          path: '**/target/surefire-reports/*'

  full-stack:
    if: github.event_name != 'pull_request'
    name: Maven / MySQL / FastAPI / Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require full project checkout
        run: |
          test -f pom.xml || { echo 'Project source missing. Import v1.2.3 first.'; exit 1; }
          test -f scripts/smoke-full.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements*.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r ai-service/requirements-dev.lock
          python -m playwright install --with-deps chromium
          npm ci --prefix frontend --no-audit --no-fund
      - name: Formatting / generated UI / schema drift checks
        run: |
          npm run format:check --prefix frontend
          node --test frontend/tests/*.test.mjs
          npm audit --prefix frontend --audit-level=high
          python scripts/build-ui-bundle.py --check
          python scripts/schema_contract.py --check
          python scripts/verify-supply-chain.py
      - name: API / SDD / source safety checks
        run: |
          python scripts/verify-java-readability.py
          python scripts/verify-api-contract.py
          python scripts/verify-api-schemas.py
          python scripts/verify-fix-regressions.py
          python scripts/verify-source.py
      - name: Start isolated MySQL for JUnit
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD=$(openssl rand -hex 24)
          ROOT_PASSWORD=$(openssl rand -hex 32)
          ADMIN_PASSWORD=$(openssl rand -hex 24)
          AI_SERVICE_KEY=$(openssl rand -hex 32)
          for secret in "$PASSWORD" "$ROOT_PASSWORD" "$ADMIN_PASSWORD" "$AI_SERVICE_KEY"; do echo "::add-mask::$secret"; done
          {
            echo 'MYSQL_TEST_URL=jdbc:mysql://127.0.0.1:3307/campus_shopping_it?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
            echo 'MYSQL_TEST_USERNAME=campus_it'
            echo "MYSQL_TEST_PASSWORD=$PASSWORD"
            echo "DB_PASSWORD=$PASSWORD"
            echo 'ADMIN_USERNAME=ci_admin'
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "AI_SERVICE_KEY=$AI_SERVICE_KEY"
          } >> "$GITHUB_ENV"
          docker run -d --name campus-mysql-it -p 127.0.0.1:3307:3306 \
            -e MYSQL_ROOT_PASSWORD="$ROOT_PASSWORD" -e MYSQL_DATABASE=campus_shopping_it \
            -e MYSQL_USER=campus_it -e MYSQL_PASSWORD="$PASSWORD" mysql:8.0.36@sha256:a532724022429812ec797c285c1b540a644c15e248579c6bfdf12a8fbaab4964
          READY=0
          for attempt in $(seq 1 90); do
            if docker exec -e MYSQL_PWD="$PASSWORD" campus-mysql-it mysql -ucampus_it \
              -e 'SELECT 1' campus_shopping_it >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          test "$READY" = 1 || { echo 'MySQL IT did not become ready'; exit 1; }
          docker exec -e MYSQL_PWD="$ROOT_PASSWORD" campus-mysql-it mysql -uroot \
            -e "GRANT ALL ON campus_shopping_migration_it.* TO 'campus_it'@'%'; GRANT PROCESS ON *.* TO 'campus_it'@'%'"
      - name: Real fresh / upgrade / replay / checksum migration checks
        run: python scripts/verify-migrations.py
      - name: Start isolated Redis for shared-session and resource tests
        run: |
          docker run -d --name campus-redis-it -p 127.0.0.1:16379:6379 redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
          READY=0
          for attempt in $(seq 1 30); do
            if [ "$(docker exec campus-redis-it redis-cli ping 2>/dev/null)" = PONG ]; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1 || { echo 'Redis IT did not become ready'; exit 1; }
          {
            echo 'REDIS_TEST_ADDRESS=redis://127.0.0.1:16379'
            echo 'REDIS_ENABLED=true'
            echo 'REDIS_SECURITY_ADDRESS=redis://127.0.0.1:16379'
            echo 'REDIS_CACHE_ADDRESS=redis://127.0.0.1:16379'
            echo "REDIS_NAMESPACE=cs:ci:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"
      - name: Real Maven build + MySQL tests
        run: |
          python ai-service/evaluate.py --dataset campus-shopping-v1 --split smoke --profile controlled --experiments P-L,P-D,P-H,P-H-R,P-TERMS --prepare-java-input "${{ github.workspace }}/var/evaluation/java-input.json"
          export EVALUATION_INPUT_PATH="${{ github.workspace }}/var/evaluation/java-input.json"
          export EVALUATION_OUTPUT_PATH="${{ github.workspace }}/var/evaluation/java-results.json"
          export EVALUATION_SAFETY_OUTPUT="${{ github.workspace }}/var/evaluation/safety"
          bash ./mvnw -B -ntp clean verify
          python scripts/generate-release-manifest.py --require-full-tests
      - name: Inventory tested application dependencies
        run: python scripts/generate-sbom.py
      - name: Local AI HTTP capacity and restart
        run: python scripts/verify-ai-load-isolated.py
      - name: Isolated Qdrant recovery
        run: python scripts/verify-qdrant-isolated.py
      - name: Java domain / HTTP / Python AI tests
        run: |
          python scripts/verify-domain.py
          python scripts/verify-http-body.py
          python scripts/verify-release.py
          mkdir -p docs/testing/evidence
          (cd ai-service && python -m pytest -q --junitxml=../docs/testing/evidence/ai-unit-tests.xml)
          python ai-service/evaluate.py
          python ai-service/evaluate.py --dataset campus-shopping-v1 --split dev --profile local --experiments K-B,K-D,K-H,K-D-R,K-H-R,R-RULE
          python ai-service/evaluate.py --dataset campus-shopping-v1 --split smoke --profile controlled --experiments K-B,K-D,K-H,R-RULE,R-LLM
          python ai-service/evaluate.py --dataset campus-shopping-v1 --split smoke --profile controlled --adapter java-mysql --experiments P-L,P-D,P-H,P-H-R,P-TERMS --java-results var/evaluation/java-results.json
          python ai-service/evaluate.py --safety-results var/evaluation/safety
          python scripts/smoke-ai-local.py
      - name: Start independent real MySQL / Spring / FastAPI
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name campus-mysql-e2e -p 127.0.0.1:3308:3306 \
            -e MYSQL_RANDOM_ROOT_PASSWORD=yes -e MYSQL_DATABASE=campus_shopping \
            -e MYSQL_USER=campus_app -e MYSQL_PASSWORD="$DB_PASSWORD" mysql:8.0.36@sha256:a532724022429812ec797c285c1b540a644c15e248579c6bfdf12a8fbaab4964
          READY=0
          for attempt in $(seq 1 90); do
            if docker exec -e MYSQL_PWD="$DB_PASSWORD" campus-mysql-e2e mysql -ucampus_app \
              -e 'SELECT 1' campus_shopping >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          test "$READY" = 1
          docker exec -i -e MYSQL_PWD="$DB_PASSWORD" campus-mysql-e2e mysql -ucampus_app \
            campus_shopping < campus-shopping-app/src/main/resources/schema.sql
          docker exec -i -e MYSQL_PWD="$DB_PASSWORD" campus-mysql-e2e mysql -ucampus_app \
            campus_shopping < campus-shopping-app/src/main/resources/data.sql
          mkdir -p var/ci docs/testing/evidence
          (cd ai-service && AI_DB_PATH=../var/ci/knowledge.sqlite3 \
            python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8100) \
            >var/ci/ai.log 2>&1 &
          echo $! >var/ci/ai.pid
          DB_URL='jdbc:mysql://127.0.0.1:3308/campus_shopping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC' \
            DB_USERNAME=campus_app BOOTSTRAP_ADMIN=true SESSION_COOKIE_SECURE=false \
            java -jar campus-shopping-app/target/campus-shopping-app.jar --spring.profiles.active=dev \
            >var/ci/app.log 2>&1 &
          echo $! >var/ci/app.pid
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8091/api/v1/categories | grep -q '"code":"0000"' \
              && [ "$(docker exec -e MYSQL_PWD="$DB_PASSWORD" campus-mysql-e2e mysql -N -s -ucampus_app \
                -e "SELECT COUNT(*) FROM iam_user u JOIN iam_platform_role r ON r.user_id=u.id WHERE u.username='ci_admin' AND r.role='PLATFORM_ADMIN'" campus_shopping)" = "1" ]; then exit 0; fi
            sleep 1
          done
          echo 'Spring HTTP health check did not pass'; exit 1
      - name: Real cross-service HTTP business E2E
        run: python scripts/smoke-full.py --check-contract
      - name: Real Redis cross-instance HTTP regression
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='jdbc:mysql://127.0.0.1:3308/campus_shopping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC' \
            DB_USERNAME=campus_app BOOTSTRAP_ADMIN=false SESSION_COOKIE_SECURE=false PORT=8092 \
            java -jar campus-shopping-app/target/campus-shopping-app.jar --spring.profiles.active=dev \
            >var/ci/app-secondary.log 2>&1 &
          echo $! >var/ci/app-secondary.pid
          READY=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8092/api/v1/categories | grep -q '"code":"0000"'; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1 || { echo 'Secondary Spring did not become ready'; exit 1; }
          python scripts/smoke-redis-shared.py --output docs/testing/evidence/redis-shared-http.json
      - name: Real Spring frontend browser E2E
        run: python frontend/tests/live_ui.py
      - name: Record this build and its acceptance evidence
        run: |
          python scripts/generate-release-manifest.py --require-full-tests \
            --evidence migrations=docs/testing/evidence/engineering/migrations.json \
            --evidence python=docs/testing/evidence/ai-unit-tests.xml \
            --evidence http=docs/testing/evidence/full-http.json \
            --evidence redis=docs/testing/evidence/redis-shared-http.json \
            --evidence browser=docs/testing/evidence/frontend-live/results.json
      - name: Upload reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: campus-acceptance-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            **/target/surefire-reports/*
            campus-shopping-app/target/release-manifest.json
            docs/testing/evidence/**
            var/ci/*.log
            var/evaluation/**
            var/supply-chain/**
      - name: Stop isolated services
        if: always()
        shell: bash
        run: |
          for file in var/ci/app-secondary.pid var/ci/app.pid var/ci/ai.pid; do
            if [ -f "$file" ]; then kill "$(cat "$file")" || true; fi
          done
          docker rm -f campus-mysql-it campus-mysql-e2e campus-redis-it || true

  browser-contract:
    if: github.event_name != 'pull_request'
    name: Chromium contract / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [legacy, current]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser contract dependencies
        run: |
          python -m pip install --require-hashes -r ai-service/requirements-dev.lock
          python -m playwright install --with-deps chromium
          npm ci --prefix frontend --no-audit --no-fund
          python scripts/build-ui-bundle.py --check
      - name: Legacy browser contract
        if: matrix.suite == 'legacy'
        run: python frontend/tests/contract_ui.py
      - name: Current browser contracts
        if: matrix.suite == 'current'
        shell: bash
        run: |
          status=0
          for script in ui_audit_contract.py ui_sdd_integration.py ui_contract_v11.py ui_fix_regression.py ui_rbac_regression.py ui_global_sort.py ui_list_pagination.py ui_r1_correctness.py; do
            python "frontend/tests/$script" || status=1
          done
          exit "$status"
      - name: Upload browser contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: campus-browser-${{ matrix.suite }}-evidence
          if-no-files-found: warn
          retention-days: 7
          path: docs/testing/evidence/**

  delivery-images:
    if: github.event_name != 'pull_request'
    name: Actual delivery images / isolated Compose transaction chain
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.lock
      - name: Install locked verification dependencies
        run: python -m pip install --require-hashes -r ai-service/requirements-dev.lock
      - name: Build and verify delivery images
        run: python scripts/verify-containers.py
      - name: Upload image acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: campus-delivery-images-evidence
          retention-days: 7
          path: docs/testing/evidence/engineering/**

  external-ai:
    name: Optional live NVIDIA / XFYUN / Milvus smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_ai == true && github.ref == 'refs/heads/main' }}
    environment: external-ai
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EMBEDDING_BASE_URL: https://integrate.api.nvidia.com/v1
      EMBEDDING_MODEL: nvidia/nemotron-3.5-embed-1b
      LLM_BASE_URL: https://maas-api.cn-huabei-1.xf-yun.com/v2
      LLM_MODEL: ${{ vars.XFYUN_MODEL }}
    steps:
      - name: Require protected main HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$GITHUB_SHA" = "$CURRENT" || { echo 'Only the current protected main commit may use provider credentials'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install AI service
        run: python -m pip install --require-hashes -r ai-service/requirements.lock
      - name: Live provider connectivity (read-only)
        env:
          EMBEDDING_API_KEY: ${{ secrets.LIVE_NVIDIA_API_KEY }}
          LLM_API_KEY: ${{ secrets.LIVE_XFYUN_API_KEY }}
          MILVUS_URI: ${{ secrets.LIVE_MILVUS_URI }}
          MILVUS_TOKEN: ${{ secrets.LIVE_MILVUS_TOKEN }}
        run: |
          set -euo pipefail
          for key in EMBEDDING_API_KEY LLM_API_KEY LLM_MODEL MILVUS_URI MILVUS_TOKEN; do
            if [ -z "$(printenv "$key" 2>/dev/null || true)" ]; then echo "Missing protected environment configuration: $key"; exit 1; fi
          done
          (cd ai-service && python -m app.smoke_model)
          (cd ai-service && python -m app.smoke_vector)
